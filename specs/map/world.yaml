# TRÁNSITO world spec — source of truth for the map.
# Conventions: see README.md in this folder. Meters; origin SW corner; +x east, +y north.
#
# Two layers:
#   grid      → AREA BUDGET only (which district owns roughly which km²). Never drawn.
#   geometry  → what the player actually sees: coastline, playable boundary, islands, routes.
# District borders in the final map follow roads, rivers, ridges and shorelines — never grid lines.

version: 2

bounds:
  width: 6000    # x, meters
  height: 8000   # y, meters
  cell_size: 1000

# North row first. One character per cell, space-separated. Codes map to districts[].code.
grid: |
  S C C S S S
  C C C J J S
  L L L J J J
  L L L L J T
  G G L J T T
  B G K K T T
  B B K K E A
  S B K S E A

geometry:
  # Land inside the bounds box (everything outside it is sea). Clockwise from the south-west.
  # South edge = Pacific coast, north edge = Caribbean coast. West and east edges are land that
  # continues past the playable boundary (rendered as low-detail "skirt" terrain, never a cliff).
  land: [
    # Pacific coast, west → east
    [0, 1150], [500, 1050], [900, 900], [1150, 650], [1250, 350],      # Balboa, canal mouth
    [1450, 450], [1700, 350], [2050, 200], [2350, 100], [2600, 200],   # old-quarter peninsula
    [2650, 600], [2800, 850], [3200, 950], [3600, 850], [3900, 550],   # bayfront curve, Punta Pacífica point
    [4300, 650], [4700, 450], [5100, 250], [5600, 200], [6000, 300],   # Costa del Este reclaim, airport shore
    # east land edge
    [6000, 6100],
    # Caribbean coast, east → west
    [5500, 6400], [4900, 6700], [4300, 6850], [3600, 6900], [3200, 7100],
    [3000, 7500], [2800, 7900], [2200, 7950], [1700, 7800], [1450, 7400], # Colón peninsula
    [1300, 7050], [1000, 6900], [700, 6950], [400, 7150], [150, 7400],    # Limón Bay inner shore
    [0, 7450]
    ]

  # Where the player can go on land. Irregular on purpose; follows natural barriers.
  # Water is playable out to the bounds box; that edge is hidden by haze and a current that
  # pushes boats back.
  playable_boundary:
    west:   # river + flooded mangrove + steep jungle west of the canal
      barrier: river-and-mangrove
      points: [[0, 7450], [100, 7300], [250, 6600], [150, 5800], [400, 5000], [300, 4300],
               [100, 3600], [300, 2800], [150, 2000], [0, 1150]]
    east:   # mountain ridge and dense jungle east of the airport and the hills
      barrier: ridge-and-jungle
      points: [[6000, 300], [5950, 300], [6000, 1200], [5900, 2200], [5700, 2900], [5850, 3500],
               [5600, 4300], [5900, 5000], [5700, 5600], [6000, 6100]]

  islands:
    - { id: causeway-islands, inspired_by: "Amador Causeway islands", points: [[1500, 150], [1700, 100], [1750, 250], [1550, 300]] }
    - { id: galeta-point,     inspired_by: "Isla Galeta",             points: [[3300, 7600], [3600, 7650], [3550, 7850], [3300, 7800]] }
    # Gatún Lake islands are generated inside the lake polygon (pipeline), not listed here.

  # Areas where the world deliberately does NOT look like a grid: diagonal canal, curved coasts,
  # peninsulas. The pipeline must keep these from OSM even after compression.
  shape_anchors: [canal, colon-peninsula, old-quarter-peninsula, punta-pacifica-point, causeway-islands, limon-bay]

  # Names for bodies of water, placed for maps and previews.
  water_labels:
    - { name: Mar Caribe,      x: 4800, y: 7500 }
    - { name: Bahía de Limón,  x: 700,  y: 7600 }
    - { name: Bahía de Panamá, x: 3300, y: 300 }

districts:
  - { id: sea,            code: S, name: Mar abierto,                inspired_by: "Caribbean Sea (north), Bay of Panama (south)", playable: water, target_km2: 7 }
  - { id: colon,          code: C, name: Colón,                   sub: "puerto, Zona Libre, casco antiguo", label_at: [1750, 7050], inspired_by: "Colón city, Manzanillo port, Colón Free Zone, Agua Clara locks", playable: land, compression: 4, density: high, target_km2: 5 }
  - { id: gatun-lake,     code: L, name: Lago Gatún,              sub: "islas y canal de navegación", inspired_by: "Gatún Lake and its islands", playable: water, compression: 10, density: very-low, target_km2: 8 }
  - { id: jungle-ridge,   code: J, name: La Cordillera,            sub: "parques nacionales, transístmica, tren", inspired_by: "Soberanía / Chagres parks, Panamá–Colón highway and railroad", playable: land, compression: 10, density: very-low, target_km2: 7 }
  - { id: canal-central,  code: G, name: Canal central,           sub: "Gamboa, el Corte", label_at: [800, 3850], inspired_by: "Gamboa, Culebra Cut, Centennial Bridge", playable: land, compression: 10, density: low, target_km2: 3 }
  - { id: pacific-locks,  code: B, name: Balboa, sub: "esclusas, puerto, Albrook", label_at: [800, 2450], inspired_by: "Miraflores, Pedro Miguel, Balboa port, Albrook, Bridge of the Americas, Amador", playable: land, compression: 4, density: medium, target_km2: 4 }
  - { id: city-core,      code: K, name: La Ciudad,               sub: "Casco, Chorrillo, banca", label_at: [2800, 1600], inspired_by: "Casco Viejo, El Chorrillo, Calidonia, Cinta Costera, banking district, Punta Pacífica, El Cangrejo", playable: land, compression: 3, density: very-high, target_km2: 5 }
  - { id: costa-del-este, code: E, name: Costa del Este,          sub: "torres y residenciales cerrados", label_at: [4450, 1550], inspired_by: "Costa del Este", playable: land, compression: 3, density: medium, target_km2: 2 }
  - { id: tito-corridor,  code: T, name: El Corredor,            sub: "San Miguelito, Juan Díaz, Pedregal", label_at: [5050, 3800], inspired_by: "San Miguelito, Juan Díaz, Pedregal, Tocumen town", playable: land, compression: 4, density: high, target_km2: 5 }
  - { id: airport,        code: A, name: Aeropuerto,         sub: "Tocumen", label_at: [5500, 450], inspired_by: "Tocumen International Airport", playable: land, compression: 4, density: low, target_km2: 2 }

# Hero and anchor locations. `district` must match the grid cell containing (x, y).
# Unless `on_water: true`, the point must be inside geometry.land.
landmarks:
  # Colón
  - { id: container-port,   district: colon,          x: 2300, y: 7400, kind: industrial,  notes: "Neto's crane yard; gantry cranes, stacks, rail spur" }
  - { id: free-zone,        district: colon,          x: 2600, y: 6400, kind: industrial,  notes: "walled warehouse grid, guarded gates" }
  - { id: neto-building,    district: colon,          x: 1600, y: 6600, kind: residential, notes: "old-town tenement; Neto's block" }
  - { id: colon-ballfield,  district: colon,          x: 1300, y: 6200, kind: civic,       notes: "the field that floods" }
  - { id: atlantic-locks,   district: colon,          x: 500,  y: 6500, kind: canal,       notes: "Atlantic locks; canal staff to bribe in Act 3" }

  # Lake / jungle / central canal
  - { id: lake-islands,     district: gatun-lake,     x: 1500, y: 5000, kind: nature,      on_water: true, notes: "jungle islands along the shipping channel" }
  - { id: ridge-overlook,   district: jungle-ridge,   x: 4300, y: 4300, kind: nature,      notes: "highway summit; both oceans on screen" }
  - { id: caribbean-cove,   district: jungle-ridge,   x: 4500, y: 6650, kind: nature,      notes: "hidden Caribbean cove east of Colón; El Consorcio's landing point (Act 6)" }
  - { id: gamboa,           district: canal-central,  x: 1400, y: 3600, kind: town,        notes: "old canal-zone village, dredge yard; on the east bank of the channel (centreline at y=3600 is x=1300)" }
  - { id: cable-bridge,     district: canal-central,  x: 1262, y: 3300, kind: bridge,      on_water: true, notes: "cable-stayed highway bridge over the cut; on the canal channel (canal centreline at y=3300 is x=1262.5)" }

  # Pacific side
  - { id: pacific-locks,    district: pacific-locks,  x: 1400, y: 1500, kind: canal,       notes: "two-step Pacific locks, visitor center" }
  - { id: balboa-port,      district: pacific-locks,  x: 1200, y: 1100, kind: industrial,  notes: "Pacific container terminal; Los Muelles territory" }
  - { id: albrook,          district: pacific-locks,  x: 1800, y: 1800, kind: transit,     notes: "bus terminal, mall, railroad terminus" }
  - { id: arch-bridge,      district: pacific-locks,  x: 1300, y: 400,  kind: bridge,      on_water: true, notes: "steel arch bridge over the canal entrance" }

  # City
  - { id: old-quarter,      district: city-core,      x: 2400, y: 400,  kind: historic,    notes: "Casco Viejo-inspired peninsula" }
  - { id: tito-city-room,   district: city-core,      x: 2200, y: 800,  kind: residential, notes: "El Chorrillo-inspired block next to the old quarter; Tito's rented room from Act 2" }
  - { id: coastal-avenue,   district: city-core,      x: 2700, y: 1200, kind: road,        notes: "bayfront boulevard and park" }
  - { id: taller-safehouse, district: city-core,      x: 3100, y: 1900, kind: industrial,  notes: "Calidonia-style auto shop; La Firma safehouse; Tito's first job with Valeria; seen on the CCTV in Act 5" }
  - { id: firm-tower,       district: city-core,      x: 3600, y: 1300, kind: office,      notes: "Valeria's legitimate front: a consulting/legal firm in a glass tower" }
  - { id: valeria-penthouse,district: city-core,      x: 3800, y: 1100, kind: residential, notes: "Punta Pacífica-style penthouse" }
  - { id: valeria-apartment,district: city-core,      x: 2800, y: 2600, kind: residential, notes: "El Cangrejo-style mid-rise; her first Panama home, kept as a memory" }
  - { id: tito-tower,       district: city-core,      x: 3300, y: 2300, kind: office,      notes: "the tower Tito buys in Act 4" }
  - { id: gated-community,  district: costa-del-este, x: 4500, y: 900,  kind: residential, notes: "Los Muelles leadership; final battle staging" }

  # Corridor / airport
  - { id: miguelito-hills,  district: tito-corridor,  x: 4500, y: 3400, kind: residential, notes: "steep informal hillside streets; Kenny's crew" }
  - { id: tito-home,        district: tito-corridor,  x: 5400, y: 2600, kind: residential, notes: "Tito's family house, under the flight path; Act 1 ends here" }
  - { id: corridor-market,  district: tito-corridor,  x: 4600, y: 2400, display_name: "Tienda de Doña Mireya", trigger_radius: 20, kind: commercial,  notes: "Doña Mireya's shop, bus stops, delivery hub" }
  - { id: passenger-terminal, district: airport,      x: 5600, y: 1700, kind: transit,     notes: "passenger terminal and drop-off" }
  - { id: cargo-terminal,   district: airport,        x: 5300, y: 1200, kind: industrial,  notes: "airside apron" }

# Polylines (x, y waypoints). Pipeline snaps them to real OSM geometry after compression.
routes:
  canal:
    kind: waterway
    points: [[300, 7900], [500, 6500], [1500, 5000], [1300, 3600], [1200, 2800], [1400, 1500], [1300, 0]]
  transisthmian-highway:
    kind: highway
    points: [[2500, 6500], [3500, 5500], [4300, 4300], [4500, 3400], [3000, 2200]]
  railroad:
    kind: rail
    points: [[2200, 6200], [3200, 5200], [2800, 4400], [1800, 3300], [1800, 1800]]
  corridor-avenue:
    kind: arterial
    points: [[3000, 2200], [4600, 2400], [5400, 2600], [5300, 1200]]
  coastal-avenue:
    kind: arterial
    points: [[2400, 400], [2700, 1200], [3600, 1300], [4500, 900]]
  causeway:
    kind: road
    points: [[1350, 450], [1500, 300], [1600, 200]]
  runway-1:
    kind: runway
    width: 45
    points: [[5150, 450], [5150, 1950]]
  runway-2:
    kind: runway
    width: 45
    points: [[5850, 500], [5850, 2000]]

# Only the active act's area is built in detail; everything else stays grey or absent.
active_area:
  act: 1
  rect: { x: [4000, 6000], y: [0, 4000] }   # corridor + airport shore (+ edge of Costa del Este)
  spawn: tito-home                          # player start; a landmark id

# Street cross-sections by route kind, meters. `width` = carriageway; `sidewalk` = each side.
# Runways use their own `width` in routes.
street_profiles:
  highway:  { width: 24, sidewalk: 0 }
  arterial: { width: 14, sidewalk: 3 }
  road:     { width: 9,  sidewalk: 2 }
  rail:     { width: 6,  sidewalk: 0 }
  waterway: { width: 120, sidewalk: 0 }
  runway:   { width: 45, sidewalk: 0 }

# Human scale: one fixed set of measures every generator and test reads (README "Human scale").
# Horizontal distances are compressed (README "Compression"); these human-sized measures are not.
scale:
  human: 1.8              # m, Tito's height (src/sim/body.ts TITO_BODY must match)
  storey: 3               # m floor-to-floor; generated building heights are whole storeys
  door: [0.9, 2.1]        # m, [width, height] of a street door; a storey must fit one
  lane: [3.0, 3.75]       # m, [min, max] width of one traffic lane; traffic carriageways hold whole lanes
  sidewalk_min: 1.5       # m, a sidewalk is 0 (none) or at least this wide
  traffic: [highway, arterial, road]   # street_profiles kinds with lanes (every street_styles.hierarchy class has them too)

# Section profiles: measured numbers that drive the street-section generator, one JSON per section,
# loaded next to this file like procedural-edits.json (src/world/spec.ts loadSectionProfiles).
# Key = profile id (must equal the file's `id`); the file names its district.
section_profiles:
  el-corredor: specs/map/sections/el-corredor.json

# Generated street network (issue #7). See "Streets" in README.md.
# Avenues are the hand-drawn `routes` (arterial/highway): the generator treats them as fixed
# constraints and never moves them. Everything below describes the streets it GENERATES between
# them; blocks are derived as faces of the resulting planar street graph.
# Deterministic: same seed + same spec → same streets and blocks.
street_styles:
  seed: 1
  # Generated street classes, same shape as street_profiles: width = carriageway (m),
  # sidewalk = each side (m). Alleys have no sidewalk.
  hierarchy:
    collector: { width: 10, sidewalk: 2.5 }
    local:     { width: 7,  sidewalk: 2 }
    alley:     { width: 3.5, sidewalk: 0 }
  # One entry per land district of the active area (validator enforces it).
  #   style: formal   → tensor-field streamlines. `field` = basis elements summed into the field:
  #                       { kind: grid, angle: deg }      straight grid rotated by angle
  #                       { kind: radial, at: [x, y] }    rings/spokes around a point (meters)
  #                       { kind: coastline }             streets parallel to geometry.land
  #                     each optionally with weight (unitless, default 1) and decay (m, falloff
  #                     distance of that element's influence).
  #                     `spacing` = separation between streamlines (m) per generated class.
  #   style: section  → built from the section profile of the same district (section_profiles above).
  #   reference: real sectors whose metrics the generated network must match (frozen in
  #     street-metrics.yaml under the same name). Each sector: name + EITHER bbox
  #     [min_lon, min_lat, max_lon, max_lat] OR place (text for the engine's /places/search) +
  #     size_m (side of a square, m); optional note; optional import_area_id (UUID of an area
  #     already stored in geospatial-reconstruction-engine — pinned, never re-requested).
  #     Max 2 km² per sector unless pinned by import_area_id.
  #     Suggested corridor sectors (San Miguelito hills, Juan Díaz, Pedregal, Tocumen town, ~1 km²
  #     each) are pending the director's choice of boxes and are NOT listed yet.
  #   land_use: fraction of blocks that become park / court (each in [0, 1], sum < 1).
  #   realism: exempt (+ realism_reason, required) skips the realism test for that district.
  districts:
    tito-corridor:
      style: section
      reference:
        - name: La Carpio
          bbox: [-84.1560494, 9.9581759, -84.1430313, 9.9666528]
          import_area_id: 6320bab5-c7e1-436d-a7bd-c542ee355cb7
          note: "San José, Costa Rica — barrio informal"
      land_use: { park: 0.06, court: 0.03 }
    costa-del-este:
      style: formal
      field:
        - { kind: grid, angle: -8, weight: 1 }
        - { kind: coastline, weight: 1, decay: 300 }
      spacing: { collector: 420, local: 46 }
      reference:
        - name: Santa Ana
          bbox: [-79.5511906, 8.9461305, -79.5203161, 8.9723801]
          import_area_id: df082f58-1e9c-416b-b110-beac5492e128
          note: "Distrito de Panamá — trazado formal"
      land_use: { park: 0.06, court: 0.03 }
    airport:
      style: formal
      field:
        - { kind: grid, angle: 0 }
      spacing: { collector: 600, local: 250 }   # sparse: service roads between aprons
      land_use: { park: 0.02, court: 0 }
      realism: exempt
      realism_reason: "Runways and apron dominate the district; no real sector of a comparable airport is frozen as a reference, so city street metrics do not apply."

# Greybox building generation, per district. Seeded: same seed → same barrio every load.
# lot = grid pitch (m); footprint/height = [min, max] m; setback = clearance from street edge (m);
# fill = probability a lot gets a building; angle = lot-grid rotation (deg) so nothing is axis-aligned;
# landmark_clearance = no buildings within this radius (m) of any landmark.
# method: parcels (default) = one centred building per parcel, from the numbers above.
# method: frontage-lots     = buildings laid along each block's street frontage from a measured
#   fingerprint (`frontage_lots`, see README "Streets"); lot/footprint/height/setback/fill/angle
#   are then unused by the generator (kept: the map validator still reads them).
blockout:
  seed: 1
  landmark_clearance: 18
  districts:
    tito-corridor:
      lot: 22
      footprint: [8, 16]
      height: [4, 10]
      setback: 4
      fill: 0.75
      angle: 12
      method: frontage-lots
      # Fingerprint of La Carpio (San José, Costa Rica; real informal barrio): median over the 47
      # blocks of engine run a249a461-91e7-4299-961e-5b9b16e0f1d8 (generation run 2026-10-11, import
      # area 6320bab5-c7e1-436d-a7bd-c542ee355cb7, bbox of street_styles tito-corridor reference).
      # Per block the engine measured median + IQR of each quantity; here: median of the block
      # medians, and median of the block IQRs. Fresh 700 m seed fragment (area b9995d49-b2d3-458e-
      # 871e-dd8a377286f8, run 0a3f59d8, 2026-11-22, 20 blocks) agrees: width 9.0, depth 11.9,
      # setback 0.87, gap 0, coverage 0.99. Source: OpenStreetMap buildings and streets,
      # © OpenStreetMap contributors. No levels are tagged in the area (storeys are drawn).
      frontage_lots:
        width:         { median: 9.0,  iqr: 4.5 }   # m along the frontage
        depth:         { median: 12.2, iqr: 5.5 }   # m into the block
        front_setback: { median: 1.1,  iqr: 2.2 }   # m from the buildable line (street buffer); only the median is used
        side_gap:      { median: 0.0,  iqr: 0.0 }   # m between neighbours: continuous rows
        coverage: 0.98          # 0–1, share of the frontage covered by buildings (outcome measured on La Carpio; the realism test target)
        two_storey_share: 0.3   # 0–1, share of 2-storey houses among 1/2-storey (engine default; no levels tagged)
        jitter: { rotation: 8, offset: 1 }   # deg ± / m ± (along, inward): the engine's informal-settlement jitter
    airport:        { lot: 70, footprint: [20, 45], height: [6, 14],  setback: 15, fill: 0.2,  angle: 0 }
    costa-del-este: { lot: 40, footprint: [14, 24], height: [20, 60], setback: 8,  fill: 0.5,  angle: -8 }

# Terrain relief of the active area (heights in meters above sea level, z of the spec plane).
# Deterministic height model, see "Relief" in README.md. Calibrate SLOPES to reality, not heights:
# the map compresses horizontal distance ~1:4 in the corridor, so real heights would read ~4x too
# steep. Real slopes measured from AWS Terrain Tiles (Mapzen terrarium, ~5 m cells) in 800 m squares.
relief:
  seed: 11
  # Water side: the sea floor falls away from the shoreline, so no cliff shows at the coast.
  sea_floor: { slope: 0.08, min_height: -8 }     # m per m offshore; floor in m
  # Land side: height = slope * distance inland from geometry.land, capped. Zero at the coast.
  coastal_ramp:
    slope: 0.004          # m per m inland (0.4 %)
    max_height: 14        # m, plateau of the ramp
    noise_taper: 150      # m inland over which all noise fades in, so the shoreline stays at 0
  land_floor: 0.5         # m, inland ground never drops below this (drainage floor, fades in with the noise)
  # Rolling terrain of the whole corridor (Juan Díaz / Pedregal / Tocumen scale), faded out inside hills.
  rolling:
    amplitude: 19         # m
    wavelength: 380       # m, of the lowest octave
    octaves: 3
    persistence: 0.45     # amplitude multiplier per octave (wavelength halves each octave)
  # Authored hill features. The mask is 1 inside core_radius and falls smoothly to 0 at radius;
  # inside it the rolling noise is replaced by the hill's own noise.
  hills:
    - id: san-miguelito
      inspired_by: "San Miguelito hills (Samaria, Torrijos-Carter), steep and maze-like"
      at: [4500, 3400]    # m, = landmark miguelito-hills
      core_radius: 450    # m, full effect
      radius: 1000        # m, effect ends
      uplift: 38          # m added at the core on top of the ramp
      noise: { amplitude: 30, wavelength: 330, octaves: 4, persistence: 0.55 }
  # Flat zones. `level: auto` = mean terrain height under the zone; `cap` = height never exceeds it
  # (reclaimed land). Each blends back to the natural terrain over `blend` meters outside the rect.
  flatten:
    # Zones apply in this order, the last wins where they overlap: the airport comes last so the cap of the
    # reclaimed land never tilts a runway. Its rect starts 150 m clear of the shore and its blend stops short of
    # it (blend < distance to the coast), so the shoreline stays at sea level (coast_tolerance).
    - { id: costa-del-este,   rect: [[4000, 0], [5000, 1800]],   cap: 3,      blend: 250 }   # reclaimed, near sea level
    - { id: tocumen-airport,  rect: [[5000, 450], [6000, 2100]], level: auto, blend: 160 }   # runways + apron
  # Every landmark in the active area gets a level pad so its marker and trigger sit on flat ground.
  landmark_pads: { radius: 25, blend: 45 }          # m
  # Street grading: a road surface takes the terrain height at its centerline (no cross-slope) and
  # its longitudinal grade never exceeds max_grade; the ground blends back to the terrain over `shoulder`.
  streets:
    max_grade: 0.22       # rise / run (22 %)
    shoulder: 14          # m, beyond carriageway + sidewalk + 2 m
  # Linear relief features of the whole isthmus (layer 2, issue I2): height = amplitude * exp(-(s/width)^2)
  # with s = signed distance to the polyline, plus along-ridge noise, merged with hills by smooth-max.
  ridges:
    - id: north-wall
      inspired_by: "hill wall 150-450 m north of the corridor"
      points: [[4300, 4300], [5000, 4600], [5800, 4400]]   # m, crest polyline; starts at landmark ridge-overlook
      width: 250          # m, half-width at 1/e
      amplitude: 100      # m, crest height above the base terrain
    - id: continental-divide
      inspired_by: "Continental Divide"
      points: [[3300, 5700], [4300, 5100], [5500, 5500]]   # m; the Transístmica crosses it near (3500, 5500)
      width: 330          # m
      amplitude: 130      # m
  # Regional uplift of the whole isthmus OUTSIDE the active area (layer 2): height + noise, faded in over
  # rect_blend m beyond the active rect and over coast_blend m inland from the shore, so the calibrated
  # plain of the active area and the shoreline (|h| <= coast_tolerance) are untouched. Calibrated against
  # the isthmus-wide slope and elevation bands in tests/terrain.test.ts.
  upland:
    height: 75
    rect_blend: 1200
    ridge_rect_blend: 300     # m, ridges fade in over this distance beyond the active rect (a crest 300 m out is full height)
    coast_blend: 400
    noise: { amplitude: 8, wavelength: 500, octaves: 4, persistence: 0.5 }
  # Baked height grid (shared by physics heightfield, ground rendering and every query).
  grid:
    cell: 4               # m between samples (active area)
    margin: 120           # m beyond the active rect, so the skirt has no cliff next to the walls
    far: { cell: 16 }     # m between samples outside the active rect (whole isthmus, layers 1-5); same origin (0, 0) as the fine grid
  # What tests/terrain.test.ts enforces. Real values, 800 m squares, 5 m cells (AWS Terrain Tiles):
  #   Samaria 16.0 / 30.1 / 42.1 %  Torrijos-Carter 8.5 / 26.9 / 40.0 %  (slope p50 / p90 / p99)
  #   Pedregal 6.3 / 12.7 %  Las Mañanitas 8.5 / 16.5 %  Tocumen 6.0 / 10.8 %  Juan Díaz 4.5 / 8.5 %
  targets:
    hills:  { slope_p50: [0.12, 0.20], slope_p90: [0.24, 0.36], slope_p99_max: 0.55 }   # Samaria band, +-25 %
    plain:  { slope_p50: [0.035, 0.085], slope_p90: [0.075, 0.175], slope_max: 0.45 }   # Juan Díaz .. Las Mañanitas
    runway_flat_tolerance: 0.05    # m, max height difference along a runway centerline
    coast_tolerance: 0.5           # m, |height| on the shoreline

# ---------------------------------------------------------------------------------------------
# Map layers 1-5 (whole isthmus). See "Layers" in README.md. Everything below sits on top of the
# unchanged geometry.land coastline and is generated in order: 1 land cover, 2 relief, 3 rivers +
# canal + lake + locks, 4 airports, 5 main roads; layer N reads only layers < N. Layers 6-9
# (secondary roads, streets, blocks, buildings) stay in the active area. The sections here are the
# authored inputs; rivers' courses and cover classes are DERIVED later, not drawn here.

# Layer 3b: Panama Canal channel, Gatún Lake and locks. The channel is routes.canal (centreline, kept
# on purpose west of the Pacific end) widened to `width`; the land polygon is not cut.
canal:
  route: canal                   # a routes entry of kind waterway
  width: 120                     # m, channel width
  sea_level: 0                   # m, channel water level on the Pacific and Caribbean reaches
  lake_level: 12                 # m in map heights (real about 26 m, scaled like all heights; proposal)
  apron: 60                      # m, flat concrete apron around each lock
  # Chambers keep real size (305 x 34 m); at the lock landmarks; `steps` = chambers in the flight.
  locks:
    - { id: miraflores, landmark: pacific-locks,  inspired_by: "Miraflores locks", steps: 2, chamber: [305, 34] }
    - { id: gatun,      landmark: atlantic-locks, inspired_by: "Gatún locks",      steps: 3, chamber: [305, 34] }
  bridge_landmarks: [arch-bridge, cable-bridge]   # landmarks that must sit on the channel

# Ambient population. Agents spawn out of view around the focus (the player) and despawn far away.
population:
  pedestrians:
    budget: 40              # max alive at once
    spawn_ring: [60, 140]   # meters from focus: spawn between min and max
    despawn_at: 180         # meters from focus
    speed: [1.1, 1.6]       # m/s, per agent
    # Street CLASSES of the generated network (avenue + street_styles.hierarchy keys) whose walkways
    # pedestrians use: sidewalks on both sides; alleys (no sidewalk) are walked on their centerline.
    # A class not listed gets no walkway (pedestrians only cross it). Issue #7: all streets.
    walk_on: [avenue, collector, local, alley]

# Procedural isthmus (src/world/proc/, `npm run isthmus`). Coarse intent only: where rock rises,
# where the dam / locks / airport are searched, town seeds and target areas, route and line stops.
# Every shape (relief, lake, rivers, canal, airfield, roads, towns, cover, tracks) is derived from
# these values and geometry.land. Positions in map metres (origin SW, +x east, +y north).
# This replaces the authored layers above (relief .. main_roads) once the game reads it (#12).
procedural:
  cell: 20                      # m, default generation grid
  relief:
    seed: 7
    background: 0.04            # uplift rate where no zone applies
    # Uplift zones: `line` (polyline + width) or `disc` (centre + radius); `rate` scales the uplift.
    zones:
      # La Cordillera: the main range across the north-east, highest along a SW-NE spine.
      - { id: cordillera, kind: line, points: [[2900, 6000], [4100, 5600], [5200, 5200], [6000, 4900]], width: 1600, rate: 1.0 }
      # Its southern spurs, falling towards the corridor and the east edge.
      - { id: cordillera-south, kind: line, points: [[4300, 5000], [5200, 4000], [5800, 2900]], width: 1000, rate: 0.65 }
      # Hills between the lake and the city, joined to the range: the Transístmica crosses them.
      - { id: central-hills, kind: line, points: [[2000, 3300], [3200, 3700], [4300, 4500]], width: 1000, rate: 0.45 }
      # Highland link from the central hills to the range: closes the lake basin on the east, so the
      # eastern valleys drain south across the corridor and the Transístmica crosses hills east of the lake.
      - { id: east-rim, kind: line, points: [[2700, 3600], [3100, 4600], [3100, 5700]], width: 900, rate: 0.4 }
      # Continental divide west of the city: separates the lake basin from the Pacific (the canal cuts it).
      - { id: divide-west, kind: line, points: [[0, 2800], [1100, 3000], [2100, 3250]], width: 750, rate: 0.5 }
      # Low hills west of the canal.
      - { id: west-hills, kind: line, points: [[200, 6000], [250, 4500], [350, 3300], [600, 1900]], width: 800, rate: 0.45 }
      # Dissected hills of the lake basin: flooding later turns their tops into islands.
      - { id: lake-basin, kind: disc, at: [1400, 5200], radius: 1800, rate: 0.14 }
    # Noise modulation of the uplift: rate *= lo + (hi - lo) * ridged(warped p).
    modulation:
      lo: 0.45
      hi: 1.45
      octaves: { wavelength: 1400, octaves: 5, gain: 0.55 }
      warp: 450                 # m
      grain_deg: 25             # dominant ridge direction, degrees
      grain_ratio: 1.8          # stretch along the grain
    coast_taper: 900            # m, uplift fades to zero over this distance from the sea (coastal plains)
    coast_wobble: { amplitude: 35, octaves: { wavelength: 260, octaves: 4, gain: 0.55 } }   # m, coastline signed-distance noise
    erosion: { iterations: 160, k: 0.05, m: 0.45, dt: 6, diffusion: 0.12 }                   # stream power + hillslope diffusion
    peak: 420                   # m, this quantile of land cells is scaled to `peak`
    peak_quantile: 0.995
    sea_floor: { shore: 2, slope: 0.035 }   # m deep at the shore, m/m offshore
    # Low hills on inland valley floors, added after erosion; flooding turns their tops into islands.
    hummocks: { amplitude: 120, octaves: { wavelength: 260, octaves: 3, gain: 0.5 }, inland: [700, 1800], max_slope: 0.25 }
  # Gatún-style reservoir: dam on the main river near the Atlantic locks, flooded to the target area.
  lake:
    dam_hint: [650, 6250]
    snap_radius: 1000           # m, search for the largest drainage area around the hint
    min_inland: 450             # m, the dam stays this far from the sea
    frame_margin: 0             # m, the lake stays this far from the map frame
    target_km2: 5
  rivers:
    min_area_km2: 0.4           # drainage area of the smallest drawn channel
    width_per_sqrt_km2: 5       # m, width = a * sqrt(area km²)
    max_width: 22               # m
  # The canal: Caribbean entrance -> dam (Atlantic locks) -> lake -> lowest pass -> Pacific locks -> Pacific.
  canal:
    caribbean: [700, 7500]      # sea point where the canal starts
    pacific_locks: [1400, 1500] # where it steps down to the Pacific
    pacific: [1300, 200]        # sea point where it ends
    width: 110                  # m
    depth: 12                   # m below its water level
    dig_weight: 0.08            # excavation cost per metre of ground above the water level
  # Tocumen-style airfield: searched near the east end of the corridor. Compressed like the city
  # (~1:2.5 of Tocumen's 3,056 m): two close parallel runways, a slim field.
  airport:
    # Detached from the corridor, in forest above the plain (#13). Further north (the vision's ~3300 m)
    # the cordillera-south spur makes the field 69 m of earthworks and strands El Corredor in hills.
    hint: [5350, 2800]
    radius: 900                 # m, search radius around the hint
    runway_length: 1200         # m
    runway_spacing: 260         # m between the two parallel runways
    runway_width: 40            # m
    margin: 50                  # m around the runways that must also be dry and flat
    distance_weight: 0.05       # penalty per metre from the hint, in metres of height spread
    heading_range: [10, 30]     # degrees clockwise from north
    apron: { length: 520, depth: 110, building: [300, 45] }   # m
    edge_margin: 200            # m inside the map frame
    towards: [2900, 1300]       # the terminal sits on this side (the city)
    culvert_penalty: 400        # m, score penalty for a field made entirely of river cells
    # Earth embankments around the levelled field (cards 1, 12-sectors 8.4): cut into the hill on the high side, fill on
    # the low side, no walls or terraces. Outside the field the ground is the field level plus or minus a ramp whose
    # slope never exceeds `grade_slope_max` (rise/run), so the ramp lengthens with the height difference, capped by
    # `grade_reach_max`. 0 = the legacy fixed 150 m smoothstep blend (it leaves cliffs where the ground is steep).
    grade_slope_max: 0.35
    grade_reach_max: 600        # m, farthest the grading reaches from the field edge
  # Main roads and the old railroad, by stops; geometry comes from slope-cost routing.
  # `airport-terminal` (reserved) is the generated airport's terminal.
  roads:
    grade:                      # grade scale g0, weight k; max_grade blocks steeper edges
      highway: { g0: 0.06, k: 3, max_grade: 0.3 }
      road: { g0: 0.08, k: 2, max_grade: 0.35 }
      rail: { g0: 0.03, k: 6, max_grade: 0.2 }
    bridge: 25                  # cost multiplier on a river cell
    sea_bridge: 250             # on a sea cell (causeway)
    canal_bridge: 120           # on a canal cell
    reuse: 0.35                 # on a cell already used by an earlier route of the same mode
    stops:
      colon: [1900, 6950]
      city: [2900, 1300]
      city-north: [3100, 2000]
      old-quarter: [2420, 420]
      pacifica: [3850, 800]
      balboa: [900, 1250]
      gamboa: [1450, 3600]
      corridor-east: [4700, 1500]   # keeps the Interamericana on the eastern plain before it climbs to the airport
    routes:
      - { id: interamericana, kind: highway, stops: [balboa, city, corridor-east, airport-terminal] }
      - { id: transistmica, kind: highway, stops: [city-north, colon] }
      - { id: gamboa-road, kind: road, stops: [city, gamboa] }
      - { id: coastal-avenue, kind: road, stops: [old-quarter, city, pacifica] }
      - { id: railroad, kind: rail, stops: [balboa, gamboa, colon] }
  # Where towns may grow: slope / height / coast preference; rivers are crossable at low suitability.
  suitability:
    max_slope: 0.22             # m/m where suitability reaches 0
    height_band: [60, 160]      # m: starts falling at the first, 0 at the second
    coast_fade: 0.55
    coast_range: 2500           # m
    crossing: 0.15              # suitability of river cells
  # Towns grow by cost distance from their seeds, cheaper near main roads, until their target area.
  towns:
    road_discount: 0.3          # step-cost multiplier near a main road
    jitter: 2.2
    jitter_wavelength: 220      # m
    min_suitability: 0.12
    seed_snap: 450              # m, seeds move to the most suitable cell within this radius
    seed: 13
    separation: 200             # m of unbuilt ground kept between cells of different towns (0 = off)
    airport_buffer: 350         # m around the airfield where no town builds (0 = off)
    items:
      - { id: la-ciudad, seeds: [[2450, 450], [2950, 1250]], target_km2: 1.8 }
      - { id: colon, seeds: [[1900, 7250]], target_km2: 0.6 }
      - { id: balboa, seeds: [[850, 1150]], target_km2: 0.45 }
      # Seeded along the route from the stop towards its end (the airport), and grows only near
      # that stretch: a ribbon instead of a second city. Optional `patches: { wavelength, threshold }`
      # leaves unbuilt gaps where a noise field (0..1) is below `threshold`: growth passes through
      # them but does not build or count them. Optional `seed_along.reach` (m): the town builds only
      # within this distance of its stretch of road.
      - { id: el-corredor, seed_along: { route: interamericana, from: city, reach: 400 }, target_km2: 0.6, road_affinity: 3, patches: { wavelength: 260, threshold: 0.3 } }
      - { id: gamboa, seeds: [[1420, 3050]], target_km2: 0.1 }
  # Coarse district influence (#13), refined AFTER towns and transit: D(p) = S·G·[Σ w·exp(-(d/σ)²)·(1+coast) + transit].
  # No items = off (the map is exactly the towns + transit result). Items are added with presets by the
  # map studio (`add-district`); each is `{ id, style, at: [x, y] | along: <road route> | around: airport, sigma, weight }`.
  districts:
    transit_weight: 0.4         # density added around metro stations (0..1)
    transit_sigma: 450          # m
    coast_weight: 0.3           # bayfront boost inside districts (never a coastal sprawl on its own)
    coast_sigma: 500            # m
    access_floor: 0.5           # share of density kept far from main roads
    access_range: 250           # m from a main road at which access falls off
    footprint: 0.25             # D at which a district counts as present
    airport_core_gap: 600       # m: dense core (D >= 0.5) stays this far from the airfield
    items: []
  cover:
    seed: 19
    beach_width: 25             # m
    mangrove: { max_height: 4, river_area_km2: 3, reach: 140 }
    clearing: { wavelength: 300, threshold: 0.5, lowland_bonus: 0.3, fringe_bonus: 0.7 }
    high_forest: { height: 230, slope: 0.4 }
  # Metro de la Ciudad and the interoceanic railway (director's sketch, 2026-11-22). Stops are
  # terminals, interchanges and via points; tracks and the stations between stops are derived.
  # `airport-terminal` (reserved) is the generated airport's terminal.
  transit:
    stops:
      old-quarter-tip: [2380, 320]
      casco: [2560, 760]
      north: [3050, 2050]
      west-junction: [2150, 1450]
      west-north: [2050, 1950]
      balboa: [850, 1150]
      bay-east: [3800, 950]
      colon: [1900, 7100]
      corridor-east: [4700, 1500]   # Línea 2 follows El Corredor (the Act 1 strip) instead of cutting through the hills
    lines:
      - { id: linea-1, name: "Línea 1", mode: metro, color: [214, 40, 40], branches: [[old-quarter-tip, casco, north]], station_spacing: 500 }
      # Two branches without a shared stop: one line or two is an open director decision (#12).
      - { id: linea-2, name: "Línea 2", mode: metro, color: [52, 178, 74], branches: [[balboa, casco, bay-east], [north, corridor-east, airport-terminal]], station_spacing: 650 }
      - { id: linea-3, name: "Línea 3", mode: metro, color: [236, 196, 40], branches: [[casco, west-junction, north], [west-junction, west-north]], station_spacing: 500 }
      - { id: ferrocarril, name: "Ferrocarril Interoceánico", mode: rail, color: [150, 96, 196], branches: [[north, colon]], station_spacing: 1000 }
    off_urban: 2.5              # metro cost multiplier off built-up ground
    off_road: 1.8               # rail cost multiplier away from main roads
    grade: { metro: 0.06, rail: 0.04 }
    bridge: 6
    interchange_radius: 90      # m, stops of different lines closer than this are one station
  # Act 1 placement (director 2026-11-22, #12 2.2), derived from the generated map, never from coordinates:
  # Tito's barrio sits at `anchor_at` along the branch of `line` that ends at `branch_to`; the Act 1 strip
  # runs along that track from the anchor to the branch end. Output: Isthmus.act1, and one report line.
  act1:
    line: linea-2
    branch_to: airport-terminal   # the line's one branch that ends at this stop
    anchor_at: 0.5                # fraction of that branch's track length (0.5 = midpoint)
    town: el-corredor             # the town the barrio belongs to (reported share of its built cells)
    barrio_radius: 340            # m, ~8 blocks of ~85 m across, centred on the anchor
    strip_half_width: 400         # m each side of the track, from the anchor to the branch end
  # Act 1 and airport landmarks on the generated map (#12 2.3), by rule, never by coordinates (README
  # "Procedural isthmus"). The x/y in landmarks: keep driving the current game until #12 2.5.
  #   anchor | { along: m } | { steepest_within: m } | { airport: terminal | apron }
  #   | { on: crossing, route: <roads route id>, feature: canal, tolerance: m }   bridge: where the generated route
  #   crosses the generated canal, on the road centreline (the deck), heading along the road; the guard
  #   bridge-landmarks-on-crossing holds the landmark within `tolerance` m of that crossing
  landmarks:
    tito-home: anchor                          # Tito's family house: the barrio centre
    corridor-market: { along: 170 }            # Doña Mireya's shop: ~2 blocks down the strip towards the airport
    miguelito-hills: { steepest_within: 600 }  # the steepest El Corredor ground near the barrio
    passenger-terminal: { airport: terminal }
    cargo-terminal: { airport: apron }
    arch-bridge: { on: crossing, route: interamericana, feature: canal, tolerance: 30 }   # the highway's bridge over the cut
  # Hiking trails (card 3 of docs/map-reshape/03-technical/12-sectors-and-streaming.md, decision 3): footpaths, not
  # roads (not drivable, steeper than a road may be). Spec + generated route only: nothing in the game reads it yet.
  # `from` is the reserved stop airport-terminal (the landside of the passenger terminal). `to` is a RULE, never a
  # coordinate: the highest dry, unbuilt cell within `highest_within` m of the airfield, inside the Act 1 rect shrunk
  # by `margin` m and at least `min_distance` m (straight line) from `from`; if the highest cannot be reached within
  # `max_length`, the next highest candidate (>= 150 m away) is tried. Cost 1 + 2 (grade / (max_grade / 2))^2 per
  # metre; cells steeper than `max_grade` (rise/run), water, the airfield (20 m fence) and built cells are refused;
  # the whole line stays inside the Act 1 rect. Guard trail-connected-and-grade.
  trails:
    - id: airport-ridge
      from: airport-terminal
      to: { highest_within: 900, margin: 120, min_distance: 700 }
      width: 1.2                # m, footpath
      max_grade: 0.30           # rise / run
      min_length: 1000          # m, routed length
      max_length: 1500          # m
  # What the game loads from the procedural map (#12 2.5): the active area is the Act 1 strip and barrio
  # (bounding box + rect_margin); districts come from the generated map on a district_cell grid
  # (majority of each cell: sea, lake, a town, the airfield, else wild), named by the districts: ids above.
  game:
    district_cell: 80           # m, cell of the derived district grid (the authored grid stays 1 km)
    rect_margin: 300            # m around the strip and the barrio
    districts: { sea: sea, lake: gatun-lake, wild: jungle-ridge, airport: airport, la-ciudad: city-core, colon: colon, balboa: pacific-locks, el-corredor: tito-corridor, gamboa: canal-central }
