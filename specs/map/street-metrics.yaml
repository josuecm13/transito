# Realism band: how far a generated district's metrics may sit from its reference.
# Taken as the proposal in issue #7 ("Banda de realismo"); reviewable by the director.
#   *_rel = relative tolerance (0.35 = ±35% of the reference value)
#   node_share_abs = absolute tolerance on dead_end_share / t_share / x_share, as a fraction
#                    (0.08 = ±8 percentage points)
band:
  default:
    block_area_median_rel: 0.35
    block_area_p90_rel: 0.50
    node_share_abs: 0.08
    intersections_per_km2_rel: 0.30
    street_km_per_km2_rel: 0.30
  overrides:
    # Small sample (53 blocks) → wider band.
    La Carpio:
      block_area_median_rel: 0.45
      block_area_p90_rel: 0.60
      node_share_abs: 0.10
